name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Package extension (.vsix)
        run: npx --yes @vscode/vsce package --no-dependencies -o gitmate.vsix

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v4
        with:
          name: gitmate-vsix
          path: gitmate.vsix
          if-no-files-found: error
