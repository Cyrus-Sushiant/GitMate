name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Resolve version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Package extension (.vsix)
        run: npx --yes @vscode/vsce package -o "gitmate-${{ steps.version.outputs.version }}.vsix"

      - name: Create GitHub Release and attach .vsix
        uses: softprops/action-gh-release@v2
        with:
          name: GitMate ${{ github.ref_name }}
          generate_release_notes: true
          files: gitmate-${{ steps.version.outputs.version }}.vsix

      # Optional: publish to the VS Code Marketplace.
      # Add a repo secret named VSCE_PAT (a Marketplace Personal Access Token) to enable.
      - name: Publish to VS Code Marketplace
        if: ${{ env.VSCE_PAT != '' }}
        run: npx --yes @vscode/vsce publish --no-dependencies --packagePath "gitmate-${{ steps.version.outputs.version }}.vsix"

      # Optional: publish to Open VSX (for VSCodium / Cursor / etc.).
      # Add a repo secret named OVSX_PAT to enable.
      - name: Publish to Open VSX
        if: ${{ env.OVSX_PAT != '' }}
        run: npx --yes ovsx publish "gitmate-${{ steps.version.outputs.version }}.vsix" --pat "$OVSX_PAT"
